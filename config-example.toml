# CleanUpInSyncoidSnapshots configuration example.
# Copy this file to e.g. config.toml, edit it, and run with either equivalent flag:
#   sudo python3 CleanUpInSyncoidSnapshots.py -c config.toml
#   sudo python3 CleanUpInSyncoidSnapshots.py --config config.toml
# Use -h/--help to show the CLI help without starting cleanup.
#
# Relative filesystem paths in this file are resolved relative to this TOML file.

[cleanup]
# Operation to perform. Use "dry-run" first to preview without destroying snapshots.
# Allowed values: "dry-run" or "delete".
command = "dry-run"

# Text file containing one exact local ZFS dataset name per non-empty line.
# If ZFS explicitly reports one listed dataset as nonexistent, later datasets are
# still processed, but the final run/mail/MQTT result remains a failure.
datasets_file = "datasets-example"

# Text file containing syncoid hostnames, one per line. Blank lines and full-line
# comments beginning with # are ignored in the hostname file.
syncoid_hosts_file = "hostnames-example"

# Optional age cutoff for snapshots and log groups. Use Nd, Nw, or Nm, where m is
# treated as 30 days. Set to an empty string to disable the age cutoff.
older_than = "7d"

# Number of newest matching snapshots to protect per hostname/dataset, and newest
# log timestamp groups to protect. Negative values are normalized to 0.
retain_count = 10

# true = when ZFS explicitly reports a configured dataset as nonexistent, record the
# failure and continue with the next configured dataset. false = stop immediately.
# Either way, the final result is failure and enabled mail/MQTT reports that failure.
continue_on_missing_dataset = true

# true = for any other checked ZFS list/destroy command failure on one dataset,
# record the failure and continue with the next configured dataset. false = stop
# immediately. This does not make global/config/root/input failures recoverable.
continue_on_other_failures = true

[logging]
# Prefix used for generated .log and .err filenames. Empty uses the script basename.
# All log files are always stored in a `logs/` directory beside the actual script.
prefix = "CleanUpInSyncoidSnapshots"

[report]
# Optional human-readable title used at the top of email and as MQTT report title.
title = "Syncoid snapshot cleanup"

# Optional free-form comment included in email and MQTT status reports.
comment = ""

[mail]
# Mail is completely optional. false disables all mail delivery.
enabled = false

# Recipient used only when enabled=true. The host must already have a working
# `mail`/`mailx` command supporting -s and --attach.
recipient = "you@example.com"

# false = send mail only after failure; successful delete and dry-run runs do not invoke
# the mail success path. true = also send mail after success.
on_success = false

[completion]
# Final success/failure reports only. Independent of [live].
enabled = false

# MQTT broker hostname or IP address, without mqtt:// or mqtts://.
host = "mqtt.example.lan"

# MQTT broker TCP port. TLS does not automatically change this value.
port = 1883

# Exact publish topic. Publishing topics cannot contain + or # wildcards.
topic = "homeassistant/CleanUpInSyncoidSnapshots/Zotac-RI531/status"

# Optional broker username. Use an empty string if authentication is not required.
username = ""

# Optional broker password as a plain TOML string. Use an empty string for no password.
password = ""

# Optional MQTT client ID. Empty lets the MQTT client/broker choose one.
client_id = ""

# MQTT QoS for the final JSON report: 0, 1, or 2.
qos = 0

# Maximum seconds allowed for the isolated MQTT publisher process, including
# DNS lookup, connection, and acknowledgement waits. Must be greater than zero.
timeout = 15

# Enable TLS certificate and hostname verification.
tls = false

# Optional CA certificate file. Empty uses system trust roots when tls=true.
# Relative paths are resolved relative to this TOML file.
ca_certs = ""

# Optional client certificate for mutual TLS. certfile and keyfile must either
# both be empty or both be configured, and they require tls=true.
certfile = ""

# Optional private key matching certfile. Encrypted-key passwords are not supported.
keyfile = ""

# false = publish only failure reports; successful delete and dry-run runs do not invoke
# the MQTT success notifier. true = also publish successful reports.
# on_success applies equally to delete and dry-run; send_on_dry_run is a second gate.
# Failures remain eligible, subject to send_on_dry_run below.
on_success = true

# false suppresses both successful and failed dry-run completion reports.
send_on_dry_run = true


[live]
# Independent HA progress and discovery. Enable either channel, both, or neither.
enabled = false
host = "mqtt.example.lan"
port = 1883
username = ""
password = ""
client_id = ""
qos = 1
timeout = 5
tls = false
ca_certs = ""
certfile = ""
keyfile = ""

# Unique lowercase ID for this job/host. Omit to derive a stable host/config ID.
device_id = "cleanup_syncoid_snapshots"
topic_prefix = "job-live"
discovery = true
discovery_prefix = "homeassistant"

# Live preview observes real execution. Publishing actual dry-runs is a separate opt-in.
send_on_dry_run = false
heartbeat_seconds = 10
min_publish_interval = 1
expire_after = 45
discovery_interval = 300
final_wait = 1
