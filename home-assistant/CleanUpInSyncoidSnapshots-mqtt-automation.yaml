alias: CleanUpInSyncoidSnapshots completion via MQTT JSON
description: Match completion.topic; consumes CleanUpInSyncoidSnapshots success/failure JSON. Dry-run reports are ignored.
triggers:
  - trigger: mqtt
    topic: homeassistant/CleanUpInSyncoidSnapshots/Zotac-RI531/status
conditions: []
actions:
  - variables:
      report: >-
        {{ trigger.payload_json
           if trigger.payload_json is defined and trigger.payload_json is mapping
           else {} }}
  - if:
      - condition: template
        value_template: "{{ report.dry_run | default(false) | bool }}"
    then:
      - stop: Preview report ignored
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ report.status | default('') == 'success'
                 and report.success is defined and report.success is sameas true
                 and report.exit_code is defined and report.exit_code is integer
                 and report.exit_code == 0 }}
        sequence:
          - action: persistent_notification.create
            data:
              title: "{{ report.title | default(report.name | default('Job')) }} succeeded"
              message: >-
                Exit code: {{ report.exit_code }}.
                {% if report.warning | default(false) %}Completed with warnings.{% endif %}
      - conditions:
          - condition: template
            value_template: >-
              {{ report.status | default('') == 'failure'
                 and report.success is defined and report.success is sameas false
                 and report.exit_code is defined and report.exit_code is integer
                 and report.exit_code != 0 }}
        sequence:
          - action: persistent_notification.create
            data:
              title: "{{ report.title | default(report.name | default('Job')) }} failed"
              message: >-
                Exit code: {{ report.exit_code }}.
                Error: {{ report.error | default('') }}
                Output: {{ report.stderr | default('') }}
    default:
      - action: persistent_notification.create
        data:
          title: Unknown or inconsistent MQTT job report
          message: "Topic: {{ trigger.topic }}. Payload: {{ trigger.payload }}"
mode: queued
max: 20
