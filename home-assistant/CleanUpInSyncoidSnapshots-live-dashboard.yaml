# Paste this as a manual dashboard card. Replace cleanup_syncoid_snapshots with device_id.
# HA may append a suffix if a requested entity ID already exists.
type: vertical-stack
cards:
  - type: entities
    title: Live job preview
    entities:
      - sensor.job_live_cleanup_syncoid_snapshots_status
      - sensor.job_live_cleanup_syncoid_snapshots_phase
      - sensor.job_live_cleanup_syncoid_snapshots_current_item
      - sensor.job_live_cleanup_syncoid_snapshots_completed
      - sensor.job_live_cleanup_syncoid_snapshots_total
      - sensor.job_live_cleanup_syncoid_snapshots_successful_dataset_count
      - sensor.job_live_cleanup_syncoid_snapshots_failed_dataset_count
      - sensor.job_live_cleanup_syncoid_snapshots_skipped_dataset_count
      - sensor.job_live_cleanup_syncoid_snapshots_runtime_seconds
      - sensor.job_live_cleanup_syncoid_snapshots_transferred_bytes
      - sensor.job_live_cleanup_syncoid_snapshots_bytes_per_second
      - sensor.job_live_cleanup_syncoid_snapshots_last_heartbeat
      - sensor.job_live_cleanup_syncoid_snapshots_last_result
  - type: gauge
    entity: sensor.job_live_cleanup_syncoid_snapshots_progress_percent
    name: Progress
    min: 0
    max: 100
  - type: markdown
    title: Latest stderr and error
    content: >-
      {% set live = 'sensor.job_live_cleanup_syncoid_snapshots_status' %}
      {% set last = 'sensor.job_live_cleanup_syncoid_snapshots_last_result' %}
      {% set source = last if states(live) in ['unknown', 'unavailable'] else live %}
      Error: {{ state_attr(source, 'error') or 'None supplied' }}

      ```text

      {{ state_attr(source, 'stderr') or 'No stderr supplied' }}

      ```
  - type: markdown
    title: Dataset results
    content: >-
      {% set live = 'sensor.job_live_cleanup_syncoid_snapshots_status' %}
      {% set last = 'sensor.job_live_cleanup_syncoid_snapshots_last_result' %}
      {% set source = last if states(live) in ['unknown', 'unavailable'] else live %}
      {% for field, label in [('successful_datasets', 'Successful'), ('failed_datasets', 'Failed'), ('skipped_datasets', 'Skipped')] %}
      **{{ label }}**

      {% for row in state_attr(source, field) or [] %}
      - {{ row.source | default(row.name | default('Unnamed dataset')) }}
        {% if row.destination | default('') %} → {{ row.destination }}{% endif %}
        {% if row.reason | default('') %}: {{ row.reason }}{% endif %}

      {% else %}
      None reported.

      {% endfor %}
      {% endfor %}
